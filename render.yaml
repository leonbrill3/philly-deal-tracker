databases:
  - name: philly-deal-tracker-db
    databaseName: phillydealtracker
    user: phillydealtracker
    plan: free

services:
  - type: web
    name: philly-deal-tracker
    runtime: node
    plan: free
    autoDeploy: true
    buildCommand: npm install --legacy-peer-deps && npx prisma generate && npx prisma db push --accept-data-loss && node prisma/seed-prod.mjs && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: philly-deal-tracker-db
          property: connectionString
      - key: NODE_VERSION
        value: "22.20.0"
      - key: NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID
        value: DEMO_MAP_ID
      # Secrets — set in the Render dashboard (Blueprint apply prompts for these)
      - key: NEXT_PUBLIC_GOOGLE_MAPS_API_KEY
        sync: false
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
